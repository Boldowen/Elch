services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elch}
      POSTGRES_USER: ${POSTGRES_USER:-ventour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ventour_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ventour_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    profiles: [admin]
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ventour.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_change_me}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ventour_network
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ventour}:${POSTGRES_PASSWORD:-ventour_change_me}@postgres:5432/${POSTGRES_DB:-elch}?schema=public
    networks:
      - ventour_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ventour}:${POSTGRES_PASSWORD:-ventour_change_me}@postgres:5432/${POSTGRES_DB:-elch}?schema=public
      PORT: 3000
      STORAGE_LOCAL_ROOT: /app/data/uploads
      RESEARCH_DATA_DIR: /app/research-data
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - ventour_network
    volumes:
      - uploads_data:/app/data/uploads
      - ./research/data:/app/research-data:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 15

networks:
  ventour_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  uploads_data:
